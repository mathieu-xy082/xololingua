name: CI

on:
  push:
    branches:
      - main
      - feat/public-deployment
      - "ci/**"
      - "ec/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  PDM_CACHE_DIR: ${{ github.workspace }}/.cache/pdm
  PDM_CHECK_UPDATE: "false"
  PDM_VENV_IN_PROJECT: "1"
  PDM_VERSION: "2.28.0"

jobs:
  check:
    name: Python + frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache PDM and project virtualenv
        uses: actions/cache@v4
        with:
          path: |
            .cache/pdm
            .venv
          key: ${{ runner.os }}-py312-pdm-${{ hashFiles('pyproject.toml', 'pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-py312-pdm-

      - name: Install Python and frontend dependencies
        run: |
          python --version
          python -m pip install --upgrade pip "pdm==$PDM_VERSION"
          pdm --version
          node --version
          npm --version
          npm ci
          PDM_IGNORE_ACTIVE_VENV=1 pdm install -G test --frozen-lockfile

      - name: Run checks
        run: |
          PDM_IGNORE_ACTIVE_VENV=1 pdm run check
          bash -n deploy/deploy_release.sh deploy/migrate_layout.sh deploy/setup_automation.sh deploy/ssh_gate.sh

  deploy:
    name: Deploy tested commit to production
    needs: check
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PRODUCTION_BRANCH != '' && github.ref_name == vars.PRODUCTION_BRANCH }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    concurrency:
      group: xololingua-production
      cancel-in-progress: false

    steps:
      - name: Deploy through restricted SSH command
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set the VPS_HOST repository variable}"
          : "${VPS_KNOWN_HOSTS:?Set the VPS_KNOWN_HOSTS repository variable}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Set the DEPLOY_SSH_PRIVATE_KEY production secret}"
          install -d -m 700 "$RUNNER_TEMP/xololingua-ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/xololingua-ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/xololingua-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/xololingua-ssh/known_hosts" "$RUNNER_TEMP/xololingua-ssh/id_ed25519"
          ssh -i "$RUNNER_TEMP/xololingua-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/xololingua-ssh/known_hosts" \
            "xololingua-deploy@$VPS_HOST" "deploy $GITHUB_SHA"
