[project]
name = "xololingua"
version = "0.1.0"
description = "Local PWA and processing service for preparing translated SRT subtitles from MP4 videos."
authors = [{ name = "Mathieu Drouin" }]
dependencies = [
  "faster-whisper>=1.2.1",
  "argostranslate>=1.9.6",
  "nvidia-cublas-cu12>=12.0; platform_system == 'Linux'",
  "nvidia-cudnn-cu12>=9.0; platform_system == 'Linux'",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "proprietary" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
test = [
  "playwright>=1.45",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
service = "python local_service.py"
web = "python scripts/web_serve.py"
browser-install = "python -m playwright install chromium"
browser-e2e = "python scripts/browser_e2e_validate.py"
e2e-browser-strict = "python scripts/browser_e2e_validate.py --require-browser-audio --require-browser-vad"
api-e2e = "python scripts/api_e2e_validate.py --target en"
test = "python -m unittest discover tests"
frontend_test = "sh -c 'node --test tests/*.test.mjs'"
check.composite = [
  "python -m compileall -q local_service.py transcribe_worker.py xololingua_service tests",
  "python -m unittest discover tests",
  "sh -c 'node --test tests/*.test.mjs'",
]
